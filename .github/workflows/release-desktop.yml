name: release-desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Build embedded bridge publish
        run: |
          $publishDir = Join-Path (Resolve-Path ..\simulator-bridge\src\SimulatorBridge) "publish"
          Remove-Item $publishDir -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish ..\simulator-bridge\src\SimulatorBridge\SimulatorBridge.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o $publishDir

          Copy-Item ..\simulator-bridge\release-resources\SimConnect.dll $publishDir -Force
          Copy-Item ..\simulator-bridge\release-resources\FSUIPC_WAPID.dll $publishDir -Force
          Copy-Item ..\simulator-bridge\release-resources\fsuipcClient.dll $publishDir -Force

          $bridgeExe = Join-Path $publishDir "SharedCockpit.Bridge.exe"
          if (-not (Test-Path $bridgeExe)) {
            throw "Embedded bridge executable missing: $bridgeExe"
          }
          $simConnectDll = Join-Path $publishDir "SimConnect.dll"
          if (-not (Test-Path $simConnectDll)) {
            throw "Embedded SimConnect.dll missing: $simConnectDll"
          }

      # Hasta 0.1.23 el único chequeo era "el .exe existe", y eso dejó pasar un
      # bridge de 0.1.15 (152 KB, framework-dependent) empacado dentro de una app
      # 0.1.23: la UI exigía bridge API 2, el bridge viejo ni siquiera reportaba
      # el campo, y el usuario quedaba con "BRIDGE UPDATE REQUIRED" sin salida.
      # Estos dos asserts convierten ese fallo silencioso en un build roto.
      - name: Verify embedded bridge is fresh and self-contained
        run: |
          $publishDir = Join-Path (Resolve-Path ..\simulator-bridge\src\SimulatorBridge) "publish"
          $bridgeExe = Join-Path $publishDir "SharedCockpit.Bridge.exe"

          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # ProductVersion viene de InformationalVersion y trae "+<commit>" por SourceLink.
          $reported = ((Get-Item $bridgeExe).VersionInfo.ProductVersion -split '\+')[0]
          if ($reported -ne $expected) {
            throw "Embedded bridge version mismatch: exe reports '$reported' but package.json is '$expected'. The publish step reused a stale binary."
          }

          # Un publish self-contained single-file pesa ~160 MB. Si sale en KB es un
          # apphost framework-dependent y no arrancaría sin .NET 8 instalado.
          $sizeMb = [math]::Round((Get-Item $bridgeExe).Length / 1MB, 1)
          if ($sizeMb -lt 40) {
            throw "Embedded bridge is only $sizeMb MB - expected a self-contained single-file publish (~160 MB)."
          }

          Write-Host "Embedded bridge OK: version $reported, $sizeMb MB."

      - name: Install desktop-ui dependencies
        run: npm ci

      - name: Publish desktop release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish
