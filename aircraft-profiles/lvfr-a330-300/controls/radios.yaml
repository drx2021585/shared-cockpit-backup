# Radios y comunicaciones del LVFR A330-300 vía SimConnect estándar + LVars
# VALIDADO: LVars/eventos idénticos al A330-200

- id: radios.com1_active_freq
  dataType: number
  authority: shared
  read:
    type: simvar
    name: "COM ACTIVE FREQUENCY:1"
  write:
    type: calculatorCode
    name: "$value (>K:2:COM_RADIO_SET_HZ:1)"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

