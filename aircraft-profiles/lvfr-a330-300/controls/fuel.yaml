# LVFR A330-300 - Fuel System Control Scaffold
# Requiere auditoría del sistema de combustible del A330-300

- id: fuel.fuel_quantity_left
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "FUEL LEFT QUANTITY"
  synchronization:
    mode: polled
    confirmAfterWrite: false

- id: fuel.fuel_quantity_center
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "FUEL CENTER QUANTITY"
  synchronization:
    mode: polled
    confirmAfterWrite: false

- id: fuel.fuel_quantity_right
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "FUEL RIGHT QUANTITY"
  synchronization:
    mode: polled
    confirmAfterWrite: false

