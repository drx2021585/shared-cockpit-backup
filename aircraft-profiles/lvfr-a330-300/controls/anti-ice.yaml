# Anti-ice y protección contra congelamiento del LVFR A330-300
# VALIDADO: LVars y eventos idénticos al A330-200

- id: antiIce.wing_anti_ice
  dataType: boolean
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "XMLVAR_Wing_AntiIce_Switch"
    nativeType: float
  write:
    type: calculatorCode
    name: "$value (>H:LVFR_Airbus_WING_AntiIce)"
  synchronization:
    mode: event
    debounceMs: 80
    confirmAfterWrite: true
    timeoutMs: 1000

