# Sistemas hidráulicos del LVFR A330-300 vía Cliente Data Area + SimConnect
# VALIDADO: LVars y eventos idénticos al A330-200

- id: hydraulics.pump_elec_1_switch
  dataType: boolean
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "XMLVAR_HYD_Pump_Elec_1_Switch"
    nativeType: float
  write:
    type: calculatorCode
    name: "$value (>H:LVFR_Airbus_HYD_Pump_Elec_1)"
  synchronization:
    mode: event
    debounceMs: 80
    confirmAfterWrite: true
    timeoutMs: 1000

