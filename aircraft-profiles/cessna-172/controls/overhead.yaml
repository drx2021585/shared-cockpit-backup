# Panel superior: luces, parking brake, fuel selector.
# Ejemplo canónico del anti-patrón TOGGLE descrito en el plan maestro (sección 19):
# usar SET_ON/SET_OFF explícito y luego confirmAfterWrite: true.

- id: lights.beacon
  dataType: boolean
  authority: shared
  read:
    type: simvar
    name: "LIGHT BEACON"
  write:
    type: inputEvent
    name: "BEACON_LIGHTS_SET"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

