# Ejes continuos → canal rápido, authority: exclusive (solo el piloto activo escribe)

- id: flight.yoke.pitch
  dataType: number
  authority: exclusive
  read:
    type: simvar
    name: "ELEVATOR POSITION"
  write:
    type: calculatorCode
    name: "(A:ELEVATOR POSITION, position) 0 (>K:ELEVATOR_SET)"
  synchronization:
    mode: polled
    debounceMs: 0
    confirmAfterWrite: false
    timeoutMs: 200

- id: flight.yoke.roll
  dataType: number
  authority: exclusive
  read:
    type: simvar
    name: "AILERON POSITION"
  write:
    type: calculatorCode
    name: "(A:AILERON POSITION, position) 0 (>K:AILERON_SET)"
  synchronization:
    mode: polled
    debounceMs: 0
    confirmAfterWrite: false
    timeoutMs: 200

- id: flight.rudder
  dataType: number
  authority: exclusive
  read:
    type: simvar
    name: "RUDDER POSITION"
  write:
    type: calculatorCode
    name: "(A:RUDDER POSITION, position) 0 (>K:RUDDER_SET)"
  synchronization:
    mode: polled
    debounceMs: 0
    confirmAfterWrite: false
    timeoutMs: 200

- id: flight.elevator_trim
  dataType: number
  authority: shared
  read:
    type: simvar
    name: "ELEVATOR TRIM POSITION"
  write:
    type: inputEvent
    name: "ELEVATOR_TRIM_SET"
  synchronization:
    mode: event
    debounceMs: 50
    confirmAfterWrite: true
    timeoutMs: 500

# Flaps: valor discreto por posición (0/10/20/30), NO un TOGGLE de pulso único.
- id: flight.flaps
  dataType: number
  authority: shared
  read:
    type: simvar
    name: "FLAPS HANDLE PERCENT"
  write:
    type: inputEvent
    name: "FLAPS_SET"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

# Tren de aterrizaje — fijo en el C172 pero se declara para uniformidad del modelo
- id: flight.gear
  dataType: boolean
  authority: shared
  read:
    type: simvar
    name: "GEAR HANDLE POSITION"
  write:
    type: inputEvent
    name: "GEAR_SET"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000
