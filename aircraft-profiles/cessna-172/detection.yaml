# Cómo el bridge decide "esta aeronave cargada es un Cessna 172 con este perfil".
# titleContains hace match contra la variable ATC MODEL / título de la aeronave activa.

titleContains:
  - "Cessna Skyhawk"
  - "C172"

# Si en el futuro dos perfiles compiten por el mismo título (ej. variantes G1000 vs
# analógica), agregar aquí discriminadores adicionales antes de subir a "full".
fallbackToPartialMatch: true
