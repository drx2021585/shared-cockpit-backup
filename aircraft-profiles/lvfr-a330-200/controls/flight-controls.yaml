# Controles de vuelo del LVFR A330-200 - Alerón, timón, compensador, flaps, tren

- id: flightControls.aileron_left
  dataType: number
  authority: shared
  read:
    type: simvar
    name: "AILERON LEFT DEFLECTION"
  write:
    type: calculatorCode
    name: "$value (>K:2:AILERON_SET)"
  synchronization:
    mode: event
    debounceMs: 50
    confirmAfterWrite: true
    timeoutMs: 1000

