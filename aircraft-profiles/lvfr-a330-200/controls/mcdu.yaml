# MCDU / CDU - Teclado del Flight Management System del LVFR A330-200
# Escribibles via eventos H:

- id: mcdu.btn_sel_left
  dataType: boolean
  authority: shared
  writeOnly: true
  write:
    type: calculatorCode
    name: "$value 0 > if{ (>H:LVFR_Airbus_MCDU_SEL_LEFT) }"
  synchronization:
    mode: event
    debounceMs: 50
    confirmAfterWrite: false

