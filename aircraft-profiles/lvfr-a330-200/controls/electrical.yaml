# LVFR expone los switches eléctricos como LVars persistentes. Sistema eléctrico completo.

- id: electrical.apu_master
  dataType: boolean
  authority: shared
  read:
    type: simvar
    name: "GENERAL ENG ANTI ICE POSITION"
  write:
    type: calculatorCode
    name: "$value (>K:2:APU_STARTER)"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

- id: electrical.gen_switch_left
  dataType: boolean
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "XMLVAR_ELEC_GenSwitch_Left"
    nativeType: float
  write:
    type: calculatorCode
    name: "$value (>H:LVFR_Airbus_Gen_Switch_Left)"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

