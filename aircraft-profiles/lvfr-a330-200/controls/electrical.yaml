- id: electrical.bat_selector
  dataType: number
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "XMLVAR_ELEC_BATSWITCH_State"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:XMLVAR_ELEC_BATSWITCH_State,number) $value != if{ $value (>L:XMLVAR_ELEC_BATSWITCH_State) }"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000
