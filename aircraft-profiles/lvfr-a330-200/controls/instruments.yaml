- id: instruments.terr_on_nd
  dataType: boolean
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "BTN_TERRONND_ACTIVE"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:BTN_TERRONND_ACTIVE,number) $value != if{ (>H:LVFR_Airbus_MFD_BTN_TERRONND) }"
  synchronization:
    mode: event
    debounceMs: 80
    confirmAfterWrite: true
    timeoutMs: 1000

- id: instruments.nd_range
  dataType: number
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "A320_Neo_MFD_Range"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:A320_Neo_MFD_Range,number) $value != if{ $value (>L:A320_Neo_MFD_Range) }"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000
