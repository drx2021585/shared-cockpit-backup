- id: instruments.vvi_display_captain
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "VERTICAL SPEED"
  synchronization:
    mode: polled
    confirmAfterWrite: false

- id: instruments.altitude_display_captain
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "INDICATED ALTITUDE"
  synchronization:
    mode: polled
