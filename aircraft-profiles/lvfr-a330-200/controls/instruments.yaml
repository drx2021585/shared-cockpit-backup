# EFIS/ND sistema completo de instrumentos con navegación y displayes

- id: instruments.hsi_course_knob
  dataType: number
  authority: shared
  read:
    type: simvar
    name: "HSI CARD"
  write:
    type: calculatorCode
    name: "$value (>K:2:HEADING_BUG_SET)"
  synchronization:
    mode: event
    debounceMs: 80
    confirmAfterWrite: true
    timeoutMs: 1000

- id: instruments.hsi_to_from_flag
  dataType: boolean
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "NAV TO FLAG:1"
  synchronization:
    mode: polled
    confirmAfterWrite: false

- id: instruments.nav1_obs
  dataType: number
  authority: shared
  read:
    type: simvar
    name: "NAV OBS:1"
  write:
    type: calculatorCode
    name: "$value (>K:2:NAV1_RADIO_SET)"
  synchronization:
    mode: event
    debounceMs: 80
    confirmAfterWrite: true
    timeoutMs: 1000

- id: instruments.nav2_obs
  dataType: number
  authority: shared
  read:
    type: simvar
    name: "NAV OBS:2"
  write:
    type: calculatorCode
    name: "$value (>K:2:NAV2_RADIO_SET)"
  synchronization:
    mode: event
    debounceMs: 80
    confirmAfterWrite: true
    timeoutMs: 1000

- id: instruments.efis_mode_captain
  dataType: number
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "XMLVAR_EFIS_Mode_Captain"
    nativeType: float
  write:
    type: calculatorCode
    name: "$value (>L:XMLVAR_EFIS_Mode_Captain)"
  synchronization:
    mode: event
    debounceMs: 80
    confirmAfterWrite: true
    timeoutMs: 1000

- id: instruments.efis_mode_fo
  dataType: number
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "XMLVAR_EFIS_Mode_FO"
    nativeType: float
  write:
    type: calculatorCode
    name: "$value (>L:XMLVAR_EFIS_Mode_FO)"
  synchronization:
    mode: event
