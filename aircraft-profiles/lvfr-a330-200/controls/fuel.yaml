# Sistema completo de combustible con monitores de cantidad, flujo y transferencias automáticas

- id: fuel.fuel_quantity_left
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "FUEL LEFT QUANTITY"
  synchronization:
    mode: polled
    confirmAfterWrite: false

- id: fuel.fuel_quantity_center
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "FUEL CENTER QUANTITY"
  synchronization:
    mode: polled
    confirmAfterWrite: false

- id: fuel.fuel_quantity_right
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "FUEL RIGHT QUANTITY"
  synchronization:
    mode: polled
    confirmAfterWrite: false

- id: fuel.fuel_flow_left
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
    name: "GENERAL ENG FUEL FLOW:1"
  synchronization:
    mode: polled
    confirmAfterWrite: false

- id: fuel.fuel_flow_right
  dataType: number
  authority: shared
  readOnly: true
  read:
    type: simvar
