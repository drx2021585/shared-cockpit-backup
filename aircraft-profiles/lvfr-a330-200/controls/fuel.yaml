- id: fuel.fuel_pump_left_ac
  dataType: boolean
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "XMLVAR_FuelPump_Left_AC"
    nativeType: float
  write:
    type: calculatorCode
    name: "$value (>H:LVFR_Airbus_FuelPump_Left_AC)"
  synchronization:
    mode: event
    debounceMs: 80
    confirmAfterWrite: true
    timeoutMs: 1000

- id: fuel.fuel_pump_right_ac
  dataType: boolean
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
