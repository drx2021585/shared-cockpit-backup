- id: communications.service_interphone_sw
  # SERVICE INTERPHONE Switch -- nodo VC_Service_Interphone_SW del modelo iFly.
  # Selector/perilla de 10 pasos. Escritura direccional: un solo
  # paso hacia el valor pedido por escritura (codigo 9 sube, 10 baja); si ya
  # esta en el destino no dispara nada. NO es un TOGGLE ciego.
  dataType: number
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_Service_Interphone_SW_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:VC_Service_Interphone_SW_VAL,number) $value < if{ 9 (>L:VC_Communications_trigger_VAL,number) } (L:VC_Service_Interphone_SW_VAL,number) $value > if{ 10 (>L:VC_Communications_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 150

