  dataType: boolean
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_Altitude_HORN_Cutout_SW_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "$value 0 > if{ 5 (>L:VC_Air_Systems_trigger_VAL,number) } els{ 6 (>L:VC_Air_Systems_trigger_VAL,number) }"
  synchronization:
