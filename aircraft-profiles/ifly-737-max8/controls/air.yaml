- id: air.high_altitude_landing_sw
  # High Altitude Landing Switch -- nodo VC_High_Altitude_Landing_SW del modelo iFly.
  dataType: number
  authority: shared
  # Unico codigo de comando (7): iFly avanza el control a su siguiente
  # posicion. Se dispara SOLO si el estado real difiere del pedido, asi que
  # converge al valor del otro piloto en vez de alternar a ciegas.
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_High_Altitude_Landing_SW_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:VC_High_Altitude_Landing_SW_VAL,number) $value != if{ 7 (>L:VC_Air_Systems_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 100

