- id: hydraulics.hydraulic_light_eng_1_low_pressure
  # Hydraulic Pump LOW PRESSURE Lights -- nodo VC_HYDRAULIC_LIGHT_ENG_1_LOW_PRESSURE del modelo iFly.
  # Boton momentaneo: true = pulsar (codigo 9), false = soltar (codigo 10).
  # Set explicito en ambos sentidos, no un TOGGLE.
  dataType: boolean
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_HYDRAULIC_LIGHT_ENG_1_LOW_PRESSURE_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "$value 0 > if{ 9 (>L:VC_Hydraulics_trigger_VAL,number) } els{ 10 (>L:VC_Hydraulics_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 50

