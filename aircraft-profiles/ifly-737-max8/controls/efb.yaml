- id: efb.efb_capt_brt_sw
  # (sin tooltip en el modelo) -- nodo VC_EFB_CAPT_BRT_SW del modelo iFly.
  # Selector/perilla de 20 pasos. Escritura direccional: un solo
  # paso hacia el valor pedido por escritura (codigo 34 sube, 33 baja); si ya
  # esta en el destino no dispara nada. NO es un TOGGLE ciego.
  dataType: number
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_EFB_CAPT_BRT_SW_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:VC_EFB_CAPT_BRT_SW_VAL,number) $value < if{ 34 (>L:VC_EFB_trigger_VAL,number) } (L:VC_EFB_CAPT_BRT_SW_VAL,number) $value > if{ 33 (>L:VC_EFB_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 150

