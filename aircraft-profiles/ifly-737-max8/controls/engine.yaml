- id: engine.apu_sw
  # APU Switch -- nodo VC_APU_SW del modelo iFly.
  # APU switch. Dominio medido en vivo moviendolo a mano (2026-07-29):
  # 0 = OFF, 10 = ON, 20 = START, y START es momentaneo -- iFly lo devuelve a
  # ON solo, en ~1.2s.
  #
  # DOS correcciones sobre la version anterior de este control, ambas por
  # observacion directa y no por la convencion del modelo:
  #
  # 1. POLARIDAD INVERTIDA respecto de la rueda. El <CallbackCode> dice
  #    WheelUp=7 / WheelDown=8, pero en vivo disparar 7 desde ON bajo a OFF y
  #    disparar 8 desde OFF subio a ON. Para ESTE control 8 sube y 7 baja.
  #    (En gear.autobrake_sw la convencion de la rueda si se cumple: la
  #    polaridad varia por control, no por sistema.)
  #
  # 2. COMPARACION POR BANDAS, no por igualdad. La L-Var esta ANIMADA: leyendo
  #    durante el retorno de START a ON se observo 14.75. Con "current 10 ==" no
  #    coincide ninguna rama a mitad de transicion y la escritura se pierde.
  #    Bandas: <5 = OFF, 5..15 = ON, >15 = START.
  #
  # Nota: pedir 20 (START) casi nunca va a "confirmar", porque el switch no se
  # queda ahi. Es correcto que asi sea -- el estado estable que comparten los
  # dos pilotos es OFF/ON.
  dataType: number
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_APU_SW_VAL"
    nativeType: float
  write:
    type: clientDataEvent
    areaName: "iFly737MAX_SDK_Control"
    event: "KEY_COMMAND_ENGAPU_APU_SET"
    parameter: "1|$ifly_apu_state|0"
    semantics: "sets the iFly APU switch to the explicit SDK state (0 OFF, 1 ON, 2 START). The bridge maps the animated L-Var bands 0/10/20 to those SDK states so shared-cockpit writes stop depending on trigger polarity or one-step wheel motion."
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 150

- id: engine.eec_1_sw_v5
  # Electronic Engine Control (EEC) Switches -- nodo VC_EEC_1_SW_V5 del modelo iFly.
  dataType: number
  authority: shared
  # Unico codigo de comando (9): iFly avanza el control a su siguiente
  # posicion. Se dispara SOLO si el estado real difiere del pedido, asi que
  # converge al valor del otro piloto en vez de alternar a ciegas.
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_EEC_1_SW_V5_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:VC_EEC_1_SW_V5_VAL,number) $value != if{ 9 (>L:VC_Engine_APU_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 100

