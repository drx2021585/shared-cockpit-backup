- id: navigation.cdu2_brt_sw
  # Brightness Control -- nodo VC_CDU2_BRT_SW del modelo iFly.
  # Selector/perilla de 20 pasos. Escritura direccional: un solo
  # paso hacia el valor pedido por escritura (codigo 320 sube, 319 baja); si ya
  # esta en el destino no dispara nada. NO es un TOGGLE ciego.
  dataType: number
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_CDU2_BRT_SW_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:VC_CDU2_BRT_SW_VAL,number) $value < if{ 320 (>L:VC_Navigation_trigger_VAL,number) } (L:VC_CDU2_BRT_SW_VAL,number) $value > if{ 319 (>L:VC_Navigation_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 150

