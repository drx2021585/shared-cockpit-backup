- id: misc.capt_seat_move_click
  # Pilot Seat -- nodo VC_CAPT_SEAT_MOVE_Click del modelo iFly.
  dataType: boolean
  authority: shared
  # Pulso unico (codigo 3) sin L-Var de estado en el modelo: solo escritura,
  # se dispara al recibir true y no hay nada que confirmar.
  writeOnly: true
  write:
    type: calculatorCode
    name: "$value 0 > if{ 3 (>L:VC_Miscellaneous_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: false
