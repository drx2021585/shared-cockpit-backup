- id: misc.cb_light_bright_sw
  # CIRCUIT BREAKER Light Control -- nodo VC_CB_Light_Bright_SW del modelo iFly.
  # Selector/perilla de 100 pasos. Escritura direccional: un solo
  # paso hacia el valor pedido por escritura (codigo 9 sube, 8 baja); si ya
  # esta en el destino no dispara nada. NO es un TOGGLE ciego.
  dataType: number
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_CB_Light_Bright_SW_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:VC_CB_Light_Bright_SW_VAL,number) $value < if{ 9 (>L:VC_Miscellaneous_trigger_VAL,number) } (L:VC_CB_Light_Bright_SW_VAL,number) $value > if{ 8 (>L:VC_Miscellaneous_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 150

