- id: gear.manual_gear_door_sw
  # Manual Extension System Access Door -- nodo VC_Manual_Gear_Door_SW del modelo iFly.
  dataType: number
  authority: shared
  # Unico codigo de comando (11): iFly avanza el control a su siguiente
  # posicion. Se dispara SOLO si el estado real difiere del pedido, asi que
  # converge al valor del otro piloto en vez de alternar a ciegas.
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_Manual_Gear_Door_SW_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:VC_Manual_Gear_Door_SW_VAL,number) $value != if{ 11 (>L:VC_Gear_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 100

