# Puertas y servicios del iFly 737 MAX 8.
#
# Fuente: SimObjects/Airplanes/iFly 737-MAX8/gsx.cfg del paquete real
# instalado. Estas L-Vars se escriben directamente (no a través de triggers
# numéricos como los switches de cabina). Rango de valores: 0 (cerrado) a 1
# (abierto). Sin verificación en vivo todavía.

- id: doors.fwd_entry
  name: Forward Entry Door
  dataType: number
  authority: shared
  read:
    type: lvar
    field: L:Animation_FWD_Entry_VAL
  write:
    type: calculatorCode
    name: "(>L:Animation_FWD_Entry_VAL, number)"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 100

- id: doors.aft_entry
