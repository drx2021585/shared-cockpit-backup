# Puertas y servicios del iFly 737 MAX 8.
#
# Fuente: SimObjects/Airplanes/iFly 737-MAX8/gsx.cfg del paquete real
# instalado. Estas L-Vars se escriben directamente (no a través de triggers
# numéricos como los switches de cabina). Rango de valores: típicamente 0
# (cerrado) a 1 (abierto), aunque algunos pueden ser animaciones que varían
# de 0 a 100. Verificado que aparecen en gsx.cfg real:
#   Animation_FWD_Entry_VAL
#   Animation_AFT_Entry_VAL
#   Animation_FWD_Service_VAL
#   Animation_AFT_Service_VAL
#   Animation_FWD_Cargo_VAL
#   Animation_AFT_Cargo_VAL

controls:
  doors.fwd_entry:
    type: binary
    name: Forward Entry Door
    read:
      type: lvar
      field: L:Animation_FWD_Entry_VAL
      scale: 1.0
    write:
      type: calculatorCode
      code: >
        (>L:Animation_FWD_Entry_VAL, number)
    capabilities:
      default: partial

  doors.aft_entry:
    type: binary
    name: Aft Entry Door
    read:
      type: lvar
      field: L:Animation_AFT_Entry_VAL
      scale: 1.0
    write:
      type: calculatorCode
      code: >
        (>L:Animation_AFT_Entry_VAL, number)
    capabilities:
      default: partial

  doors.fwd_service:
    type: binary
    name: Forward Service Door
    read:
      type: lvar
      field: L:Animation_FWD_Service_VAL
      scale: 1.0
    write:
      type: calculatorCode
      code: >
        (>L:Animation_FWD_Service_VAL, number)
    capabilities:
      default: partial

  doors.aft_service:
    type: binary
    name: Aft Service Door
    read:
      type: lvar
      field: L:Animation_AFT_Service_VAL
      scale: 1.0
    write:
      type: calculatorCode
      code: >
        (>L:Animation_AFT_Service_VAL, number)
    capabilities:
      default: partial

  doors.fwd_cargo:
    type: binary
    name: Forward Cargo Door
    read:
      type: lvar
      field: L:Animation_FWD_Cargo_VAL
      scale: 1.0
    write:
      type: calculatorCode
      code: >
        (>L:Animation_FWD_Cargo_VAL, number)
    capabilities:
      default: partial

  doors.aft_cargo:
    type: binary
    name: Aft Cargo Door
    read:
      type: lvar
      field: L:Animation_AFT_Cargo_VAL
      scale: 1.0
    write:
      type: calculatorCode
      code: >
        (>L:Animation_AFT_Cargo_VAL, number)
    capabilities:
      default: partial
