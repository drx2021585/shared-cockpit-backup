- id: warnings.flap_inhibit_sw
  # Ground Proximity FLAP INHIBIT Switch -- nodo VC_Flap_Inhibit_SW del modelo iFly.
  # Selector/perilla de 10 pasos. Escritura direccional: un solo
  # paso hacia el valor pedido por escritura (codigo 25 sube, 26 baja); si ya
  # esta en el destino no dispara nada. NO es un TOGGLE ciego.
  dataType: number
  authority: shared
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_Flap_Inhibit_SW_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:VC_Flap_Inhibit_SW_VAL,number) $value < if{ 25 (>L:VC_Warning_Systems_trigger_VAL,number) } (L:VC_Flap_Inhibit_SW_VAL,number) $value > if{ 26 (>L:VC_Warning_Systems_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 150

