- id: anti_ice.capt_foot_air_sw
  # FOOT AIR Controls -- nodo VC_CAPT_FOOT_AIR_SW del modelo iFly.
  dataType: number
  authority: shared
  # Unico codigo de comando (77): iFly avanza el control a su siguiente
  # posicion. Se dispara SOLO si el estado real difiere del pedido, asi que
  # converge al valor del otro piloto en vez de alternar a ciegas.
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:VC_CAPT_FOOT_AIR_SW_VAL"
    nativeType: float
  write:
    type: calculatorCode
    name: "(L:VC_CAPT_FOOT_AIR_SW_VAL,number) $value != if{ 77 (>L:VC_Anti_Ice_trigger_VAL,number) }"
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 100

