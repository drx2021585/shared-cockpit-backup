schemaVersion: 1

aircraft:
  id: ifly-737-max8
  name: iFly B737 MAX 8
  developer: iFly Development Team

# El paquete instalado declara minimum_game_version 1.39.12 (MSFS 2020) y el
# mismo .wasm se carga en MSFS 2024. No hay mappings/ especificos por version:
# los controles usan L-Vars del propio addon, que son identicas en ambos sims.
compatibility:
  msfs2020: true
  msfs2024: true

# ¿Se voló este perfil contra MSFS de verdad? Alimenta la etiqueta "verificado"
# de la UI y se reporta SEPARADO del % de cobertura, que solo mide completitud
# mecánica (ver computeCoverage en server/api/src/profiles.ts).
# untested: el perfil entero se generó desde el XML del modelo instalado (ver
# tools/generate_ifly_profile.py y la cabecera de controls/*.yaml). Es
# mecánicamente muy completo -- justamente por eso hay que decir explícitamente
# que ningún control se probó en el sim todavía.
verification: untested

versions:
  # package_version del manifest.json real del addon instalado.
  minimum: "1.1.0.0"
  tested:
    - "1.1.0.0"

# Modelos que cubre este perfil, tal como aparecen en SimObjects/Airplanes/ del
# paquete instalado. Los cuatro comparten el mismo modelo interior (cada uno
# hace <IncludeBase> del mismo iFly737Max_INTERIOR.xml, ver detection.yaml), asi
# que un solo perfil los cubre a todos -- por eso se listan aca en vez de tener
# un perfil por variante. La UI los muestra en la tarjeta de la aeronave para
# que el jugador sepa cuales le sirven.
variants:
  - "iFly 737-MAX8"
  - "iFly 737-MAX8-166Seats"
  - "iFly 737-MAX8-189Seats"
  - "iFly 737-MAX8200"

# Un solo prefijo cubre las 4 variantes de asientos, las 3 libreas dedicadas y
# el MAX 8-200 -- todos los aircraft.cfg del paquete arrancan con esta cadena
# (verificado sobre la instalacion real). Ver detection.yaml.
detection:
  titleContains:
    - "iFly 737-MAX8"

# ---------------------------------------------------------------------------
# Estos niveles alimentan el % de compatibilidad de la UI. No miden "vuelo
# verificado", eso lo expresa `verification: untested` arriba; aca solo se
# declara cuan completo es el soporte MECANICO disponible en controls/*.yaml.
#
# Revision 2026-07-30:
# - flightControls/autopilot/electrical/hydraulics ya tienen cobertura
#   bidireccional casi total o total, asi que se declaran "full".
# - air/antiIce/engine/fuel/fireProtection/instruments/warnings tambien tienen
#   cobertura mecanica muy alta o completa, y ahora el schema ya permite
#   declararlos sin esconderlos detras del promedio del perfil.
# - radios sigue "partial": el bloque communications.yaml todavia deja 30
#   controles writeOnly, asi que no hay lectura/escritura pareada completa.
# - mcdu sube a "full" por cobertura mecanica: los teclados y selectores
#   relevantes del bloque navigation.yaml estan practicamente completos. La
#   pantalla del CDU de iFly SIGUE sin espejo, pero eso queda documentado como
#   limitacion funcional aparte, no como falta de mapeo de controles.
# - efb se mantiene "partial": esta muy cubierto mecanicamente, pero sigue
#   siendo una UI personal por piloto; no conviene venderlo como soporte pleno
#   de cabina compartida.
# - cabinMisc se declara "full" porque el porcentaje mide completitud
#   mecanica. Aunque muchos controles sean cosmeticos, la cobertura bidireccional
#   de esa seccion ya es alta y real.
#
# iFly tampoco expone SET absoluto: cada escritura avanza UN paso hacia el
# valor pedido. Eso sigue siendo una limitacion real del addon, pero no impide
# declarar "full" cuando el sistema ya tiene cobertura mecanica casi completa y
# determinista dentro del modelo de sincronizacion actual.
#
# Nota: el canal alternativo del SDK propio de iFly (Client Data Area
# "737MAX_SDK_ClientData" + evento cliente "737MAX_External_Command", ambos
# confirmados por strings dentro de panel/iFly737-MAX.wasm) sigue SIN usar
# aqui: falta el header oficial de iFly con el layout del struct y la
# codificacion del comando. Ver NOTAS-SDK.md.
# ---------------------------------------------------------------------------
capabilities:
  # controls/flight-controls.yaml (36) + controls/gear.yaml (22).
  flightControls: full
  # controls/autoflight.yaml (43): MCP completo (selectores de curso, IAS/MACH,
  # heading, altitud, V/S y botones de modo).
  autopilot: full
  # controls/electrical.yaml (30).
  electrical: full
  # controls/hydraulics.yaml (10).
  hydraulics: full
  # controls/communications.yaml (182): 3 ACP, 3 RTP, interfono, CVR, ADF.
  radios: partial
  # Los dos CDU viven en controls/navigation.yaml (teclados completos como
  # botones momentaneos). La PANTALLA del CDU no esta espejada todavia -- no
  # hay screens/ en este perfil, porque el contenido del CDU de iFly no se
  # expone como L-Var y requeriria el SDK propio (ver NOTAS-SDK.md).
  mcdu: full
  failures: none
  air: full
  antiIce: full
  engine: full
  fuel: full
  fireProtection: full
  instruments: full
  warnings: full
  efb: partial
  cabinMisc: full
