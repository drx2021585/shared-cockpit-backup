# Aire acondicionado / presurización (AIR_*) y protección de hielo (ICE_*)
# del PMDG 737-900/900ER — sin categoría propia en
# packages/profile-schema/manifest.schema.json, documentado bajo una sección
# "air" nueva en capabilities.yaml (mismo patrón que "lights"/"fms").
#
# Todos los campos "AIR_*"/"ICE_*" de abajo tienen offset REAL transcrito EN
# ORDEN, sin huecos, en apps/simulator-bridge/.../PmdgNg3DataLayout.cs (tramo
# transcrito del struct PMDG_NG3_Data, entre HYD_PumpSw_elec y
# LTS_LandingLtRetractableSw). No se agregó ningún campo que no esté en esa
# tabla.
#
# Campos EXCLUIDOS deliberadamente (bloqueados por esquema, ver
# EVENT_IDS_PENDIENTES.md sección "Bloqueado por esquema" -- nativeType hoy
# solo admite bool/uchar/uint/char_array, no float ni int):
#   AIR_DuctPress[2], AIR_DuctPressNeedle[2], AIR_CabinAltNeedle,
#   AIR_CabinDPNeedle, AIR_CabinVSNeedle, AIR_CabinValveNeedle,
#   AIR_TemperatureNeedle (todos float)
#   ICE_WindowHeatTestSw (int)
#
# ACTUALIZACIÓN 2026-07-26 — EVT_EVENT_IDS_FULL.txt (transcripción completa
# del header, 842 #define con comentario original) confirma por escrito 25
# Event IDs EVT_OH_EC_*/EVT_OH_AIRCOND_*_800/EVT_OH_BLEED_*/EVT_OH_PRESS_*/
# EVT_OH_ICE_*. Esos 25 controles (equip_cooling_supply_norm/exhaust_norm,
# temp_source_selector, trim_air_switch, recirc_fan_switch_1/2,
# pack_switch_1/2, bleed_air_switch_1/2, apu_bleed_air_switch,
# isolation_valve_switch, pressurization_mode_selector, outflow_valve_switch,
# flt_alt_window, land_alt_window, ice.window_heat_sw_1..4,
# ice.probe_heat_sw_1/2, ice.wing_anti_ice_sw, ice.eng_anti_ice_sw_1/2) se
# convirtieron de readOnly a escribibles (write.type: clientDataEvent contra
# PMDG_NG3_Control). Para temp_source_selector/trim_air_switch se usó
# explícitamente la variante "_800" del Event ID (header: "-800/900 panel
# only"), correcta para este perfil -900/900ER. air.flt_alt_window/
# land_alt_window usan los eventos dedicados "_SET" (offset 14507/14508,
# rango distinto a los EVT_OH_* de switches) pese a que el campo de LECTURA
# correspondiente está marcado "WARNING obsolete" en el header (se prefiere
# AIR_DisplayFltAlt/AIR_DisplayLandAlt para lectura futura, pero el Event de
# escritura en sí sigue vigente). El resto (anunciadores, displays de texto,
# campos bloqueados por esquema) permanece readOnly: true. Sigue sin
# confirmación EN VIVO contra MSFS+PMDG real -- ver EVENT_IDS_PENDIENTES.md.
#
# Convención de índice neutral _1 (índice 0) / _2 (índice 1) para todos los
# arrays de tamaño 2, y _1/_2/_3/_4 para arrays de tamaño 3/4, SIN evidencia
# propia de a qué lado/zona/motor físico corresponde cada índice -- misma
# convención que electrical.yaml/hydraulics.yaml/engine.yaml/fuel.yaml.
#
# AIR_DisplayFltAlt[6]/AIR_DisplayLandAlt[6]: char arrays de texto -- dataType
# string, nativeType char_array (mismo patrón que ELEC_MeterDisplayTop/Bottom).

- id: air.equip_cooling_supply_norm
  dataType: boolean
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "AIR_EquipCoolingSupplyNORM"
    nativeType: bool
  write:
    type: clientDataEvent
    areaName: "PMDG_NG3_Control"
    event: "EVT_OH_EC_SUPPLY_SWITCH"
    parameter: "$value"
    semantics: "sets the EQUIPMENT COOLING SUPPLY switch to the explicit boolean state being written (AIR_EquipCoolingSupplyNORM); Parameter=1/0 explicit"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

