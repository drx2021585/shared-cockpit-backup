# IRS (Inertial Reference System) y selectores de nav display del PMDG
# 737-900/900ER — capabilities: sin categoría propia en
# packages/profile-schema/manifest.schema.json (igual que "lights", ver nota
# en capabilities.yaml), documentado ahí bajo una sección "fms" nueva.
#
# Todos los campos "IRS_*" y "NAVDIS_*" de abajo tienen offset REAL transcrito
# EN ORDEN, sin huecos, en apps/simulator-bridge/.../PmdgNg3DataLayout.cs
# (tramo transcrito del struct PMDG_NG3_Data, entre AFS_ControlsRoll y
# ADF_StandbyFrequency). No se agregó ningún campo que no esté en esa tabla.
# packages/profile-schema/README.md usaba "fms.irs_l_mode_selector" como
# EJEMPLO ilustrativo del esquema, pero nunca había sido implementado como
# control real hasta ahora (ver "fms.irs_mode_selector_1" abajo, mismo campo
# subyacente IRS_ModeSelector[0] con id distinto porque acá se sigue la
# convención de sufijo _1/_2 por índice crudo, igual que electrical.yaml/
# hydraulics.yaml, sin asumir a qué IRS físico corresponde cada índice).
#
# ACTUALIZACIÓN 2026-07-26 — EVT_EVENT_IDS_FULL.txt (transcripción completa
# del header, 842 #define con comentario original) confirma por escrito 7
# Event IDs: EVT_OH_NAVDSP_VHF_NAV_SEL/IRS_SEL/FMC_SEL/DISPLAYS_SOURCE_SEL/
# CONTROL_PANEL_SEL (para los 5 NAVDIS_*Selector) y EVT_IRU_MSU_LEFT/RIGHT
# (nótese el prefijo EVT_IRU_, no EVT_OH_, pero coincide por nombre/semántica
# con IRS_ModeSelector[2] -- "IRS Mode Selector Unit"). Esos 7 controles se
# convirtieron de readOnly a escribibles (write.type: clientDataEvent contra
# PMDG_NG3_Control). El resto (annunciators, displays de texto) permanece
# readOnly: true. Sigue sin confirmación EN VIVO contra MSFS+PMDG real -- ver
# EVENT_IDS_PENDIENTES.md.
#
# IRS_annunALIGN[2]/IRS_annunON_DC[2]/IRS_annunFAULT[2]/IRS_annunDC_FAIL[2]/
# IRS_ModeSelector[2]: convención de índice neutral _1 (índice 0) / _2
# (índice 1), SIN evidencia propia de a qué IRS físico (L/R, o L/C/R si el
# 737 tuviera 3) corresponde cada índice -- corregir si se descubre lo
# contrario.
#
# IRS_DisplayLeft[7]/IRS_DisplayRight[8]: char arrays de texto del display de
# posición IRS -- dataType string, nativeType char_array (mismo patrón que
# ELEC_MeterDisplayTop/Bottom en electrical.yaml).

- id: fms.irs_display_selector
  dataType: number
  authority: shared
  readOnly: true
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "IRS_DisplaySelector"
    nativeType: uchar
  synchronization:
    mode: polled
    confirmAfterWrite: false

