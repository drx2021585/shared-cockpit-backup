- id: fms.irs_mode_selector_1
  dataType: number
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "IRS_ModeSelector"
    arrayIndex: 0
    nativeType: uchar
  write:
    type: clientDataEvent
    areaName: "PMDG_NG3_Control"
    event: "EVT_IRU_MSU_LEFT"
    semantics: "sets the LEFT IRS Mode Selector Unit to the explicit numeric position being written (IRS_ModeSelector[0]: 0 OFF, 1 ALIGN, 2 NAV, 3 ATT, per PMDG_NG3_SDK.h comment); Parameter must carry the absolute target position. Event is prefixed EVT_IRU_ (not EVT_OH_) but matches this field by name/semantics"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

