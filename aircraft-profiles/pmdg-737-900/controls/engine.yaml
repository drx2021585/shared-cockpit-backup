- id: engine.start_selector_1
  dataType: number
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "ENG_StartSelector"
    arrayIndex: 0
    nativeType: uchar
  write:
    type: calculatorCode
    name: "(L:switch_119_73X,number) $value 10 * < if{ 11902 (>K:ROTOR_BRAKE) } (L:switch_119_73X,number) $value 10 * > if{ 11901 (>K:ROTOR_BRAKE) }"
  synchronization:
    mode: event
    debounceMs: 150
    confirmAfterWrite: true
    timeoutMs: 1000

