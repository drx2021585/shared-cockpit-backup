# Sistema de combustible del PMDG 737-900/900ER — capabilities.fuel:
# capabilities.yaml lo tenía en "none"; este archivo lo sube a "partial de
# solo lectura" (ver capabilities.yaml para el detalle honesto).
#
# Todos los campos "FUEL_*" de abajo tienen offset REAL transcrito EN ORDEN,
# sin huecos, en apps/simulator-bridge/.../PmdgNg3DataLayout.cs (tramo
# transcrito del struct PMDG_NG3_Data, entre ADF_StandbyFrequency y
# ELEC_annunBAT_DISCHARGE). No se agregó ningún campo que no esté en esa
# tabla.
#
# FUEL_FuelTempNeedle, FUEL_QtyCenter, FUEL_QtyLeft, FUEL_QtyRight (los 4
# campos float del tramo) quedaron deliberadamente FUERA: nativeType hoy solo
# admite bool/uchar/uint/char_array en control.schema.json -- no hay forma
# honesta de declarar un campo float sin inventar un nativeType no soportado.
# Ver EVENT_IDS_PENDIENTES.md, sección "Bloqueado por esquema".
#
# ACTUALIZACIÓN 2026-07-26 — con EVT_EVENT_IDS_FULL.txt (transcripción
# completa del header, 842 #define con su comentario original) se
# confirmaron por escrito 14 Event IDs EVT_OH_FUEL_* (bombas FWD/AFT/CTR,
# crossfeed, AUX FWD/AFT A/B, FWD/AFT bleed, GND XFR) y se convirtieron esos
# 14 controles de readOnly a escribibles (write.type: clientDataEvent contra
# PMDG_NG3_Control). Los anunciadores (FUEL_annun*) permanecen readOnly: true
# -- no tiene sentido escribir un anunciador. Sigue sin confirmación EN VIVO
# contra MSFS+PMDG real -- ver EVENT_IDS_PENDIENTES.md.
#
# FUEL_PumpFwdSw[2]/FUEL_PumpAftSw[2]/FUEL_PumpCtrSw[2]/FUEL_AuxFwd[2]/
# FUEL_AuxAft[2]/FUEL_annunENG_VALVE_CLOSED[2]/FUEL_annunSPAR_VALVE_CLOSED[2]/
# FUEL_annunFILTER_BYPASS[2]/FUEL_annunLOWPRESS_Fwd[2]/
# FUEL_annunLOWPRESS_Aft[2]/FUEL_annunLOWPRESS_Ctr[2]: convención de índice
# neutral _1 (índice 0) / _2 (índice 1), SIN evidencia propia de a qué motor/
# tanque físico corresponde cada índice -- misma convención que
# electrical.yaml/hydraulics.yaml/engine.yaml.

- id: fuel.crossfeed_sw
  dataType: boolean
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "FUEL_CrossFeedSw"
    nativeType: bool
  write:
    type: clientDataEvent
    areaName: "PMDG_NG3_Control"
    event: "EVT_OH_FUEL_CROSSFEED"
    semantics: "sets the CROSSFEED selector to the explicit boolean state being written (FUEL_CrossFeedSw); Parameter=1/0 explicit"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

