    confirmAfterWrite: true
    timeoutMs: 1000

# BUG REAL CORREGIDO (2026-07-27): este control usaba write.type=inputEvent,
# name="GEAR_SET" (evento K: estándar de MSFS con Parameter 0/1 explícito).
# Evidencia real (apps/desktop-ui/recurso/definitions/FS2020/aircraft/
# "PMDG Simulations - Boeing 737NG Series.yaml", la implementación de
# referencia probada de YourControls -- misma fuente ya usada verbatim para
# native_toggle.landing_gear_lever_unlock, L:switch_4552_73X): el PMDG NG3 NO
# escucha K:GEAR_SET para su gear lever -- su lógica (heredada de FSX/P3D)
# solo hookea los dos K:events legacy separados y deterministas K:GEAR_UP /
# K:GEAR_DOWN ("Gear Lever Up" -> "1 (>K:GEAR_UP)" cuando L:switch_455_73X==0;
# "Gear Lever Down" -> "1 (>K:GEAR_DOWN)" cuando L:switch_455_73X==60). Esto
# explicaba el síntoma reportado "sube pero no baja": K:GEAR_SET(0) coincide
# con el comportamiento por defecto del sim base (sube), pero PMDG nunca
# procesa K:GEAR_SET(1) para bajar el tren porque su gauge nunca escucha ese
# evento. Corregido usando la convención nueva de BridgeService
# (ResolveInputEventPulse): 'name' con separador '|' declara dos K:events
# nativos separados, elegidos según el valor booleano absoluto (SET_ON/SET_OFF
# explícito, no un toggle -- ver CLAUDE.md raíz). true (gear down) -> primer
# evento; false (gear up) -> segundo evento.
- id: flight.gear
  dataType: boolean
  authority: shared
  read:
    type: simvar
    name: "GEAR HANDLE POSITION"
  write:
    type: inputEvent
    name: "GEAR_DOWN|GEAR_UP"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

