    nativeType: uchar
  write:
    type: clientDataEvent
    areaName: "PMDG_NG3_Control"
    event: "EVT_OH_ALT_FLAPS_POS_SWITCH"
    semantics: "sets the ALTERNATE FLAPS position switch to the explicit numeric position being written (FCTL_AltnFlaps_Control_Sw: 0 UP, 1 OFF, 2 DOWN, per PMDG_NG3_SDK.h comment); Parameter must carry the absolute target position"
  synchronization:
