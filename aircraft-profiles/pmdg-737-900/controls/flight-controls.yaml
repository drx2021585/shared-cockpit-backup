    semantics: "sets the ALTERNATE FLAPS master switch to the explicit boolean state being written (FCTL_AltnFlaps_Sw_ARM); Parameter=1/0 explicit. Guard (EVT_OH_ALT_FLAPS_MASTER_GUARD) not modeled"
