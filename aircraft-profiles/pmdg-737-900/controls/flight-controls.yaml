# PLACEHOLDER: mapeos SimConnect estándar (simvars/eventos K:), NO la Client
# Data Area / SDK oficial de PMDG (bloqueado — ver docs/plan-maestro.md Fase 7,
# pendiente de que Darwin provea el SDK/headers reales). Estos controles deben
# revalidarse contra el avión real en cuanto el SDK esté disponible.
#
# Ejes continuos → canal rápido (polled), authority: exclusive.
# Discretos (flaps handle, gear, spoilers) → canal confiable (event) con
# confirmAfterWrite, SIEMPRE SET explícito, nunca TOGGLE crudo.
#
# CORREGIDO 2026-07-27 por simulator-bridge-agent (BUG REAL, verificado en vivo
# contra MSFS 2024 + PMDG 737-900 real, avión en tierra):
#   1. El RPN anterior "(A:X POSITION, position) 0 (>K:X_SET)" empujaba la
#      posición leída SIN USARLA y luego un "0" fijo -- el elevador/alerón/
#      rudder SIEMPRE se fijaba a 0 sin importar el valor real que se estaba
#      sincronizando. Reemplazado por el marcador "$value" (mismo mecanismo ya
#      usado por write.type=clientDataEvent, ver BridgeService.
#      ResolveCalculatorCodeTemplate/DynamicParameterPlaceholder), que el
#      bridge sustituye por el valor numérico absoluto real en cada escritura.
#   2. K:ELEVATOR_SET / K:AILERON_SET / K:RUDDER_SET (eventos K: legacy) NO
#      mueven ninguna superficie en el PMDG NG3 -- confirmado en vivo:
#      "3000 (>K:RUDDER_SET)" dejó A:RUDDER POSITION en 0.0000 (antes==durante).
#      PMDG NG3 solo escucha los eventos de EJE real K:AXIS_*_SET (igual que
#      un joystick real conectado). "8000 (>K:AXIS_RUDDER_SET)" SÍ movió el
#      rudder a A:RUDDER POSITION=-0.4883, y "-8000 (>K:AXIS_RUDDER_SET)" a
#      +0.4883 (relación lineal confirmada con dos puntos): position ≈
#      -(param/16384), rango param [-16384, 16384]. El RPN de abajo hace esa
#      escala/inversión de signo directamente en RPN ("$value -16384 * ..."),
#      clampeado a [-16384, 16384] con "min max" de RPN estándar.
#   3. Elevator/aileron usan la MISMA familia de eventos AXIS_*_SET y se aplicó
#      la misma fórmula por consistencia (convención estándar de SimConnect
#      para axis controls -- ver SimConnect SDK docs, "Event IDs" / "Axis
#      Events"), pero SOLO el rudder se verificó en vivo hoy. Aileron/elevator
#      deben revalidarse en vivo (signo/rango) antes de confiar en ellos para
#      vuelo real -- no se hizo hoy por prudencia (yoke con avión en tierra es
#      menos observable/riesgoso que confirmarlo en pleno vuelo).
#
# ACTUALIZACIÓN 2026-07-27 (misma noche, tras publish/deploy real por el
# orquestador contra la sesión activa de MSFS+PMDG, avión en tierra):
#   - flight.yoke.pitch (elevator): CONFIRMADO funcionando en vivo con el build
#     publicado real (control.axis value=0.2 por el WebSocket del bridge,
#     readback de ELEVATOR POSITION se movió claramente hacia el valor
#     enviado: -0.15 -> +0.033 -> +0.08). K:AXIS_ELEVATOR_SET es correcto.
#   - flight.rudder: ya confirmado antes (ver arriba), no se retesteó.
#   - flight.yoke.roll (aileron): NO se movió en esa misma prueba (readback de
#     AILERON POSITION fijo en 0 con +0.6/-0.6/0, sin bridge.error). Causa
#     real encontrada por simulator-bridge-agent vía el header oficial del SDK
#     (C:\MSFS 2024 SDK\WASM\include\MSFS\Types\MSFS_EventsEnum.h):
#       #define KEY_AXIS_ELEVATOR_SET   (KEY_ID_MIN + 226)
#       #define KEY_AXIS_AILERONS_SET   (KEY_ID_MIN + 227)   <- PLURAL "AILERONS"
#       #define KEY_AXIS_RUDDER_SET     (KEY_ID_MIN + 228)
#     El Event ID real es "AXIS_AILERONS_SET" (plural), NO "AXIS_AILERON_SET"
#     (singular) como se usaba abajo -- a diferencia de elevator/rudder, que sí
#     son singulares. Un K:event con nombre no registrado en SimConnect es un
#     no-op silencioso (sin excepción, sin error reportado por el bridge), lo
#     que explica exactamente el síntoma observado. Corregido abajo a
#     "AXIS_AILERONS_SET".
#
# ACTUALIZACIÓN 2026-07-28 (misma sesión, avión ya en tierra, MSFS+FSUIPC7
# reabiertos tras el cierre): "flight.yoke.roll" CONFIRMADO funcionando en
# vivo con "AXIS_AILERONS_SET" (plural) — control.axis value=0.6 por el
# WebSocket del bridge, readback de AILERON POSITION llegó a 0.5999..;
# vuelto a 0 -> readback -0.0000243 (centrado). Los 3 ejes (yoke.pitch,
# yoke.roll, flight.rudder) quedan confirmados en vivo con el mismo nivel de
# confianza. Hipótesis (1)/(2)/(4) de abajo ya no aplican (el fix del nombre
# del evento fue la causa raíz real, no hacía falta descartar autopilot ni
# hardware).
#   - Hipótesis descartadas/pendientes para el aileron (documentado para no
#     repetir la investigación): (1) ¿AILERON POSITION es un read real? no se
#     pudo re-verificar en vivo tras el cierre de MSFS, pendiente. (2)
#     ¿autopilot/control wheel steering re-centrando el input? no se pudo
#     probar en vivo, pendiente (AP suele estar OFF en tierra, pero no se
#     confirmó el estado real en esa sesión). (4) ¿hardware con eje de alerón
#     asignado peleando el valor? C:\FSUIPC7\FSUIPC7.ini no tiene ninguna
#     asignación de joystick/axis (solo "AxisCalibration=No"), así que no hay
#     interferencia a nivel FSUIPC -- no se pudo descartar una asignación
#     nativa de MSFS (Opciones > Controles) sin la sim corriendo.

- id: flight.yoke.pitch
  dataType: number
  authority: exclusive
  read:
    type: simvar
    name: "ELEVATOR POSITION"
  write:
    type: calculatorCode
    # CONFIRMADO EN VIVO 2026-07-27 contra el build publicado real: value=0.2
    # por control.axis movió ELEVATOR POSITION claramente hacia el valor
    # enviado (-0.15 -> +0.033 -> +0.08). Signo/escala exactos (vs. el caso
    # rudder, que sí tiene el signo verificado con dos puntos) no se
    # recalibraron con precisión numérica, pero la dirección de movimiento es
    # correcta y consistente con la fórmula del rudder.
    name: "$value -16384 * -16384 16384 min max (>K:AXIS_ELEVATOR_SET)"
  synchronization:
    mode: polled
    debounceMs: 0
    confirmAfterWrite: false
    timeoutMs: 200

- id: flight.yoke.roll
  dataType: number
  authority: exclusive
  read:
    type: simvar
    name: "AILERON POSITION"
  write:
    type: calculatorCode
    # FIX 2026-07-27 (NO reverificado en vivo todavía -- ver nota de archivo
    # arriba): el Event ID real es "AXIS_AILERONS_SET" (PLURAL), confirmado
    # contra el header oficial del SDK (MSFS_EventsEnum.h,
    # KEY_AXIS_AILERONS_SET). El nombre anterior "AXIS_AILERON_SET" (singular)
    # no existe como evento registrado -> no-op silencioso, que es exactamente
    # el síntoma reportado (readback fijo en 0, sin bridge.error). Pendiente:
    # re-probar en vivo con la sim arriba de nuevo antes de confiar en el
    # signo/escala (se asume la misma fórmula que elevator/rudder, no
    # verificada para aileron específicamente).
    name: "$value -16384 * -16384 16384 min max (>K:AXIS_AILERONS_SET)"
  synchronization:
    mode: polled
    debounceMs: 0
    confirmAfterWrite: false
    timeoutMs: 200

- id: flight.rudder
  dataType: number
  authority: exclusive
  read:
    type: simvar
    name: "RUDDER POSITION"
  write:
    type: calculatorCode
    # CONFIRMADO EN VIVO 2026-07-27 (MSFS 2024 + PMDG 737-900 real, avión en
    # tierra): param=8000 -> A:RUDDER POSITION=-0.4883; param=-8000 ->
    # +0.4883. position ≈ -(param/16384) -> param ≈ -(position*16384).
    name: "$value -16384 * -16384 16384 min max (>K:AXIS_RUDDER_SET)"
  synchronization:
    mode: polled
    debounceMs: 0
    confirmAfterWrite: false
    timeoutMs: 200

- id: flight.elevator_trim
  dataType: number
  authority: shared
  read:
    type: simvar
    name: "ELEVATOR TRIM POSITION"
  write:
    type: inputEvent
    name: "ELEVATOR_TRIM_SET"
  synchronization:
    mode: event
    debounceMs: 50
    confirmAfterWrite: true
    timeoutMs: 500

# Flaps: manija discreta (0/1/2/5/10/15/25/30/40 en el 737 real vía PMDG FMC;
# aquí se mapea a la posición de la manija estándar de MSFS), NO un TOGGLE de
# pulso único.
- id: flight.flaps
