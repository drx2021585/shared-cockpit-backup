    areaName: "PMDG_NG3_Control"
    event: "EVT_OH_SPOILER_B_SWITCH"
    semantics: "sets the SPOILER B switch to the explicit boolean state being written (FCTL_Spoiler_Sw[1]); Parameter=1/0 explicit. Guard (EVT_OH_SPOILER_B_GUARD) not modeled"
  synchronization:
