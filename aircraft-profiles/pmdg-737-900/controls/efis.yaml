# --- EFIS control panels + selectores del panel principal, 2026-07-27 ---
#
# Todos los controles de este archivo obtienen su offset de lectura del tramo
# NUEVO transcrito en apps/simulator-bridge/.../PmdgNg3DataLayout.cs (sección
# "Glareshield en adelante", desde EFIS_MinsSelBARO hasta MAIN_LightsSelector,
# ver PMDG_NG3_SDK.h líneas 330-388). NINGUNO de estos controles tiene bloque
# `write`: se revisó EVT_EVENT_IDS_FULL.txt (candidatos calculados
# THIRD_PARTY_EVENT_ID_MIN + offset, comentario original del header) y NINGÚN
# candidato confirma explícitamente semántica de SET absoluto ("Sets X..."),
# a diferencia de los EVT_MCP_*_SET usados en controls/autopilot.yaml -- solo
# nombran el switch físico (ej. "CAPT side MAIN PANEL DISPLAY UNITS (MAIN
# PANEL DUs) Selector"). Por prudencia (mismo criterio que
# lights.circuit_breaker_knob/overhead_panel_knob) se dejan readOnly: true.
# Ver EVENT_IDS_PENDIENTES.md para el detalle y los Event ID candidatos por
# campo, y para lo que falta para cerrar cada uno (confirmación en vivo de
# semántica de SET explícito).
#
# NADA de esto fue confirmado EN VIVO contra MSFS+PMDG real todavía.

- id: efis.mins_sel_baro_capt
  dataType: boolean
  authority: shared
  readOnly: true
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "EFIS_MinsSelBARO"
    arrayIndex: 0
    nativeType: bool
  synchronization:
    mode: polled
    confirmAfterWrite: false

