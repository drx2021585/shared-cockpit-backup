# Miscelánea de cabina/anunciadores del PMDG 737-900/900ER que no encaja en
# ningún otro archivo de controls/: PSEU, interphone, oxígeno, anunciadores de
# tren en el panel superior, flight recorder, CVR, limpiaparabrisas, letreros
# de cabina (no fumar/cinturones/llamada/PA) y puertas. Sin categoría propia
# en packages/profile-schema/manifest.schema.json, documentado bajo una
# sección "cabinMisc" nueva en capabilities.yaml.
#
# Todos los campos de abajo tienen offset REAL transcrito EN ORDEN, sin
# huecos, en apps/simulator-bridge/.../PmdgNg3DataLayout.cs (mismo tramo del
# struct PMDG_NG3_Data ya cubierto por electrical.yaml/hydraulics.yaml/
# lights.yaml/fms.yaml/engine.yaml/fuel.yaml/air.yaml). No se agregó ningún
# campo que no esté en esa tabla.
#
# ACTUALIZACIÓN 2026-07-26 — EVT_EVENT_IDS_FULL.txt (transcripción completa
# del header) confirma por escrito 6 Event IDs:
# EVT_OH_SERVICE_INTERPHONE_SWITCH, EVT_OH_WIPER_LEFT_CONTROL/
# WIPER_RIGHT_CONTROL, EVT_OH_NO_SMOKING_LIGHT_SWITCH/
# FASTEN_BELTS_LIGHT_SWITCH, EVT_OH_FLTREC_SWITCH. Esos 6 controles
# (comm.service_interphone_sw, overhead.wiper_l_selector/r_selector,
# comm.no_smoking_selector/fasten_belts_selector, recorder.fltrec_sw_normal)
# se convirtieron de readOnly a escribibles (write.type: clientDataEvent
# contra PMDG_NG3_Control). CVR_annunTEST y OXY_SwNormal permanecen readOnly:
# true -- el primero es un anunciador puro por convención de nombre ("annun"),
# el segundo no tiene un candidato de Event ID confirmado con semántica clara
# (EVT_OH_OXY_PASS_SWITCH parece ser el switch de oxígeno de PASAJEROS, no el
# de tripulación que representa OXY_SwNormal -- no se asumió esa
# equivalencia). El resto (anunciadores de puertas/tren/PSEU) permanece
# readOnly: true. Sigue sin confirmación EN VIVO contra MSFS+PMDG real.

- id: warnings.annun_pseu
  dataType: boolean
  authority: shared
  readOnly: true
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "WARN_annunPSEU"
    nativeType: bool
  synchronization:
    mode: polled
    confirmAfterWrite: false

- id: comm.service_interphone_sw
  dataType: boolean
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "COMM_ServiceInterphoneSw"
    nativeType: bool
  write:
    type: clientDataEvent
    areaName: "PMDG_NG3_Control"
    event: "EVT_OH_SERVICE_INTERPHONE_SWITCH"
    parameter: "$value"
    semantics: "sets the SERVICE INTERPHONE switch to the explicit boolean state being written (COMM_ServiceInterphoneSw); Parameter=1/0 explicit"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

