# PLACEHOLDER: SimConnect estándar, no SDK/Client Data Area oficial de PMDG
# (bloqueado, ver Fase 7 del plan maestro). El sistema eléctrico real del
# PMDG 737 tiene mucha más lógica (buses, APU generator, external power
# interlocks) gestionada internamente por el add-on; aquí solo se exponen los
# switches base vía simvars/eventos estándar de MSFS que tienen un evento SET
# explícito real. Se omiten deliberadamente APU generator switch y external
# power: en el SimConnect estándar de MSFS solo existen como pulso crudo
# (TOGGLE_APU_GENERATOR_SWITCH / TOGGLE_EXTERNAL_POWER, sin variante _SET),
# lo cual violaría la regla anti-TOGGLE. Se agregarán cuando el SDK oficial de
# PMDG esté disponible y exponga un L:Var/HVar de set explícito.
#
# Todos boolean, SIEMPRE SET explícito, nunca TOGGLE crudo.

- id: electrical.battery
  dataType: boolean
  authority: shared
  read:
    type: simvar
    name: "ELECTRICAL MASTER BATTERY"
  write:
    type: inputEvent
    name: "MASTER_BATTERY_SET"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

- id: electrical.apu_master
  dataType: boolean
  authority: shared
  read:
    type: simvar
    name: "APU SWITCH"
  write:
    type: inputEvent
    name: "APU_STARTER"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

- id: electrical.avionics_master
  dataType: boolean
  authority: shared
  read:
    type: simvar
    name: "AVIONICS MASTER SWITCH"
  write:
    type: inputEvent
    name: "AVIONICS_MASTER_SET"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

# --- Client Data Area de PMDG (PMDG_NG3_Data), campos ELEC_* -- solo lectura, 2026-07-25 ---
#
# packages/profile-schema/control.schema.json ahora soporta controles
# readOnly (write opcional + readOnly: true explícito). Todos los campos
# "ELEC_*" listados abajo tienen offset REAL transcrito EN ORDEN, sin huecos,
# en apps/simulator-bridge/.../PmdgNg3DataLayout.cs (desde
# ELEC_annunBAT_DISCHARGE hasta ELEC_BusPowered[16], dentro del tramo del
# struct SÍ cubierto por esa tabla). NO se agregó ningún campo que no esté en
# esa tabla.
#
# Se declaran todos como readOnly: true (sin `write`) porque NINGUNO tiene un
# Event ID de PMDG_NG3_Control confirmado hoy -- ver
# aircraft-profiles/pmdg-737-900/EVENT_IDS_PENDIENTES.md, sección
# "Candidatos ELEC_*": esa tabla lista valores CALCULADOS (THIRD_PARTY_EVENT_ID_MIN
# + offset del #define del header) para varios de estos campos (GenSw,
# APUGenSw, GrdPwrSw, BusTransSw_AUTO, StandbyPowerSelector,
# IDGDisconnectSw, DCMeterSelector, ACMeterSelector, BatSelector,
# CabUtilSw, IFEPassSeatSw), pero un valor CALCULADO desde el header no es lo
# mismo que un Event ID CONFIRMADO en vivo contra MSFS+PMDG (política del
# proyecto: nunca inventar/asumir un Event ID de escritura sin esa
# confirmación). Cuando alguno de esos candidatos se valide en vivo (pasos en
# EVENT_IDS_PENDIENTES.md), ese control específico debe moverse de readOnly a
# escribible (agregar `write.type: clientDataEvent` + quitar `readOnly`).
#
# Los siguientes SÍ son anunciadores/displays puros por naturaleza (no tiene
# sentido que alguna vez tengan write): annunBAT_DISCHARGE, annunTR_UNIT,
# annunELEC, annunSTANDBY_POWER_OFF, annunGRD_POWER_AVAILABLE,
# annunTRANSFER_BUS_OFF, annunSOURCE_OFF, annunGEN_BUS_OFF,
# annunAPU_GEN_OFF_BUS, MeterDisplayTop/Bottom, BusPowered[16] (estado
# calculado del bus, no un switch).
#
# ELEC_BusPowered[16]: el struct expone 16 booleans en un array plano. El
# header/tabla transcrita NO documenta a qué bus físico corresponde cada
# índice (BUS 1, BUS 2, STANDBY, GROUND SERVICE, etc.) -- se exponen como
# electrical.bus_powered_<0..15> genéricos, honestos sobre el índice crudo,
# sin inventar un nombre de bus que no está confirmado.
#
# ACTUALIZACIÓN 2026-07-26 — EVT_EVENT_IDS_FULL.txt (transcripción completa
# del header con comentario original de cada #define) confirma por escrito
# 14 de los Event IDs "candidatos calculados" listados en
# EVENT_IDS_PENDIENTES.md (DC/AC meter selector, BAT selector, CAB UTIL,
# IFE/PASS, IDG disconnect x2, standby power selector, GRD PWR, bus transfer,
# GEN x2, APU GEN x2). Esos 14 controles se convirtieron de readOnly a
# escribibles (write.type: clientDataEvent contra PMDG_NG3_Control). Los
# anunciadores/displays/bus status permanecen readOnly: true (no tiene
# sentido escribirlos). Sigue sin confirmación EN VIVO contra MSFS+PMDG real
# -- ver EVENT_IDS_PENDIENTES.md para el checklist pendiente.
#
# Convención de índice en pares [0]/[1]: cuando EVENT_IDS_PENDIENTES.md ya
# documentó explícitamente qué lado es cada índice (GenSw, APUGenSw,
# IDGDisconnectSw: [0]=izquierdo, [1]=derecho), se usa sufijo _1/_2 en el id
# siguiendo esa misma convención L/R. Para los pares sin esa confirmación
# explícita (annunDRIVE, annunTRANSFER_BUS_OFF, annunSOURCE_OFF,
# annunGEN_BUS_OFF) se asume la misma convención L=índice0/R=índice1 por
# consistencia con los switches asociados del mismo subsistema, pero SIN
# evidencia propia -- si se descubre que está invertido, corregir aquí.

- id: electrical.annun_bat_discharge
  dataType: boolean
  authority: shared
  readOnly: true
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "ELEC_annunBAT_DISCHARGE"
    nativeType: bool
  synchronization:
    mode: polled
    confirmAfterWrite: false

