# Switches booleanos del PMDG 737NG portados desde la instalación real de
# YourControls de Darwin (apps/desktop-ui/recurso/definitions/FS2020/aircraft/
# "PMDG Simulations - Boeing 737NG Series.yaml"), mecanismo confirmado real:
# el evento NATIVO de SimConnect "ROTOR_BRAKE" (no propietario de PMDG) se
# reutiliza como bus genérico -- cada switch tiene su propio event_param fijo
# (switchNumber*100+1). Validado contra MSFS real en vivo 2026-07-27: enviar
# ROTOR_BRAKE con param 11701 (TAXI LIGHT, switch 117) prendió y apagó la luz
# real de la cabina sin errores.
#
# 2026-07-27, misma sesión: cada control ahora también tiene 'read' contra el
# Client Data Area propio "SharedCockpitBridge_LVars" que expone
# simulator/wasm-bridge (módulo WASM propio del proyecto, NO probado aún
# contra MSFS real -- compila y enlaza limpio, ver
# simulator/wasm-bridge/README.md). Hasta que Darwin instale ese módulo en su
# carpeta Community, estos controles seguirán funcionando solo de escritura
# (el bridge C# reporta con gracia si el área no está disponible, no crashea).
#
# LIMITACIÓN HONESTA que sigue vigente: la escritura es un PULSO DE TOGGLE, no
# un SET_ON/SET_OFF real -- es el único mecanismo que PMDG expone para estos
# switches. Con el 'read' ya se puede al menos CONFIRMAR el estado resultante
# (y a futuro, decidir si hace falta reenviar el toggle o no antes de escribir).
# authority: 'shared' sigue siendo el valor por defecto del proyecto.

- id: native_toggle.hud_stow_hide_switch
  # HUD Stow Hide Switch (L:switch_979_73X)
  dataType: boolean
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "SharedCockpitBridge_LVars"
    field: "L:switch_979_73X"
    nativeType: bool
  write:
    type: nativeEventValue
    name: "ROTOR_BRAKE"
    parameter: 97901
    semantics: "toggles PMDG NG3 switch (HUD Stow Hide Switch, L:switch_979_73X) via ROTOR_BRAKE carrier event, param=97901; ported from YourControls' proven mapping. No absolute SET available -- PMDG only exposes a toggle pulse for this switch. Read confirmation now available via simulator/wasm-bridge (L:switch_979_73X), pending install/validation against real MSFS."
  synchronization:
    mode: event
    confirmAfterWrite: true
    debounceMs: 150

