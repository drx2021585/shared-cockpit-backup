# Teclado del CDU/MCDU izquierdo (Captain) y derecho (First Officer) del PMDG
# 737-900/900ER, generado programaticamente desde
# apps/desktop-ui/Documentation/SDK/EVT_EVENT_IDS_FULL.txt (140 defines con
# prefijo EVT_CDU_L_*/EVT_CDU_R_*, uno por tecla fisica: L1..L6, R1..R6,
# digitos 0-9, letras A-Z, EXEC, CLR, DEL, y demas teclas del teclado alfa/
# numerico + function keys). Patron writeOnly aprobado en
# packages/profile-schema/README.md, seccion "Botones momentaneos" -- cada
# tecla es un press momentaneo sin estado persistente que releer (writeOnly:
# true, sin bloque read, parameter: 1 fijo, confirmAfterWrite: false).
#
# Todos los 140 Event IDs vienen literalmente de EVT_EVENT_IDS_FULL.txt (no
# inventados). Convencion de id: "mcdu.captain.key_<tecla>" para EVT_CDU_L_*,
# "mcdu.fo.key_<tecla>" para EVT_CDU_R_* (L=izquierdo=Captain,
# R=derecho=First Officer, misma convencion L/R que el resto del perfil).
# 2026-07-26.

- id: mcdu.captain.key_l1
  dataType: boolean
  authority: shared
  sdkTier: clientDataArea
  writeOnly: true
  write:
    type: clientDataEvent
    areaName: "PMDG_NG3_Control"
    event: "EVT_CDU_L_L1"
    parameter: 1
    semantics: "presses CDU L L1 key"
  synchronization:
    mode: event
    confirmAfterWrite: false
    debounceMs: 150

