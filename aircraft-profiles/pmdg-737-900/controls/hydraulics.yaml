- id: hydraulics.pump_sw_eng_1
  dataType: boolean
  authority: shared
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "HYD_PumpSw_eng"
    arrayIndex: 0
    nativeType: bool
  write:
    type: clientDataEvent
    areaName: "PMDG_NG3_Control"
    event: "EVT_OH_HYD_ENG1"
    parameter: "$value"
    semantics: "sets the ENG 1 hydraulic pump switch to the explicit boolean state being written (HYD_PumpSw_eng[0]); Parameter=1/0 explicit. Index0->ENG1 assumed by name match, not verified live"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

