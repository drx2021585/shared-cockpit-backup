# --- MCP "_SET" events, ACTUALIZACIÓN 2026-07-26 ---
#
# EVT_EVENT_IDS_FULL.txt (transcripción completa del header) incluye un grupo
# de Event IDs con offset 14500+ (muy por fuera del rango bajo de los
# EVT_OH_*/EVT_MCP_* de switches) cuyo COMENTARIO ORIGINAL documenta
# explícitamente una semántica de "set" con parámetro absoluto, ej.
# "EVT_MCP_HDG_SET // Sets new heading, commands the shortest turn" o
# "EVT_MCP_VS_SET // Sets MCP VS (if VS window open) to parameter-10000".
# Esto es justo lo opuesto a los selectores continuos descartados en
# EVENT_IDS_PENDIENTES.md (EVT_MCP_HEADING_SELECTOR/EVT_MCP_COURSE_SELECTOR_L,
# que se accionan por MOUSE_FLAG_WHEEL_* -- pulso relativo, no SET_VALUE) --
# los "_SET" son un mecanismo DISTINTO, dedicado, con parámetro absoluto
# documentado, igual de seguro que EVT_OH_LIGHTS_LOGO (write.type: inputEvent
# con "#<id>" y el valor real transmitido como dwData en tiempo de escritura,
# ver SimConnectNativeClient.TransmitSetEvent).
#
# ACTUALIZACIÓN 2026-07-27: PmdgNg3DataLayout.cs YA transcribe el tramo MCP_*
# completo (offset real de MCP_Course[2]/MCP_IASMach/MCP_Heading/MCP_Altitude/
# MCP_VertSpeed, PMDG_NG3_SDK.h líneas 338-346), pero el bloque `read` de
# course/heading/altitude/vs SIGUE sin poder agregarse: esos 4 campos son
# `unsigned short`/`short` (2 bytes) en el struct C real, y
# packages/profile-schema/control.schema.json -> read.nativeType solo admite
# el enum ["bool", "uchar", "uint", "char_array", "float", "int"] -- NO existe
# "ushort"/"short". PmdgNg3DataLayout.LayoutFieldKind SÍ modela estos dos
# tipos (igual que ya hacía con Float/Int) solo para que el offset acumulado
# de los campos siguientes (MAIN_*, HGS_*, LTS_*BrtKnob) sea correcto -- pero
# no hay forma honesta de declarar `read` para ellos sin inventar un
# nativeType no soportado. Esto es un contrato compartido
# (packages/profile-schema) y DEBE pasar por el orchestrator si se quiere
# resolver (agregar "ushort"/"short" al enum + el parsing correspondiente en
# el bridge), no se tocó en esta sesión -- ver EVENT_IDS_PENDIENTES.md.
#
# `mcp_ias_set`/`mcp_mach_set` tienen un bloqueo DISTINTO y más profundo,
# incluso siendo `float` (nativeType SÍ soportado): ambos comparten el MISMO
# campo `MCP_IASMach` (el comentario original del header dice literalmente
# "Mach if < 10.0", es decir el mismo float representa IAS o Mach según el
# modo activo del MCP, sin un campo separado que indique cuál de los dos
# modos está activo en este tramo transcrito). Declarar `read` en ambos
# controles apuntando al mismo campo mostraría el mismo valor crudo en los
# dos (ej. "250" interpretado como IAS en un control y como Mach 2.50 en el
# otro), lo cual sería activamente engañoso para el jugador remoto -- se deja
# como writeOnly a propósito hasta encontrar un campo de modo confiable o
# lógica adicional que distinga IAS vs Mach.
#
# EVT_MCP_MACH_SET: parameter*0.01 (enviar 78 para M0.78) -- el bridge hoy
# transmite el valor crudo como dwData (TransmitSetEvent), así que quien
# escriba este control debe enviar el valor YA multiplicado por 100 (78, no
# 0.78). Documentado aquí porque el esquema no tiene forma de expresar un
# factor de escala.
# EVT_MCP_VS_SET: parameter-10000 (enviar 8200 para -1800fpm) -- mismo caso,
# quien escriba debe sumar 10000 al VS deseado antes de transmitir.

- id: autopilot.mcp_crs_l_set
  dataType: number
  authority: captain-only
  writeOnly: true
  sdkTier: clientDataArea
  write:
    type: inputEvent
    name: "#84132"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: false
    timeoutMs: 500

