# --- Client Data Area de PMDG (PMDG_NG3_Data), campos AFS_* -- solo lectura,
# 2026-07-26. Todos tienen offset REAL transcrito en
# apps/simulator-bridge/.../PmdgNg3DataLayout.cs (entre IRS_DisplayShowsDots y
# WARN_annunPSEU). Son anunciadores/status internos del Autopilot Flight
# System reales de PMDG (no simvars genéricas de MSFS) -- NO reemplazan a los
# controles simvar de arriba (esos siguen siendo el único mecanismo
# escribible de este archivo); son un tramo de solo lectura adicional, honesto
# sobre no tener Event ID de escritura confirmado (ninguno de los dos .cpp de
# ejemplo del SDK menciona EVT_*AFS*).
- id: autopilot.afs_autothrottle_servos_connected
  dataType: boolean
  authority: shared
  readOnly: true
  sdkTier: clientDataArea
  read:
    type: clientDataArea
    areaName: "PMDG_NG3_Data"
    field: "AFS_AutothrottleServosConnected"
    nativeType: bool
  synchronization:
    mode: polled
    confirmAfterWrite: false

