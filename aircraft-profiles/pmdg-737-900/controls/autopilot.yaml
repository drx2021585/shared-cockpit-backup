# PLACEHOLDER: mapeos SimConnect estándar (simvars/eventos K:), NO la
# integración real con el FMC/CDU de PMDG (bloqueado, ver Fase 7 del plan
# maestro — pendiente SDK oficial). Estos controles solo reflejan el estado
# físico del MCP a través de simvars/eventos genéricos de MSFS y NO garantizan
# reflejar fielmente lo que PMDG hace internamente (su lógica de AP/FD es
# propia). Cobertura "partial" — ver capabilities.yaml.

- id: autopilot.master
  dataType: boolean
  authority: captain-only
  read:
    type: simvar
    name: "AUTOPILOT MASTER"
  write:
    type: inputEvent
    name: "AP_MASTER"
  synchronization:
    mode: event
    debounceMs: 100
    confirmAfterWrite: true
    timeoutMs: 1000

